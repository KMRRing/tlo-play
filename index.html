<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Last Omen</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1597940,"index.wasm":37695054},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		unlockThenStart();
	}
	const BUILD_V = '1124.1854+ead4894';
async function _updCheck() {
	try {
		const r = await fetch('version.json?ts=' + Date.now(),
			{ cache: 'no-store' });
		const d = await r.json();
		if (d && d.v && d.v !== BUILD_V) {
			location.replace(location.pathname + '?v=' +
				encodeURIComponent(d.v) + location.hash);
		}
	} catch (e) {}
}
setInterval(_updCheck, 60000);
document.addEventListener('visibilitychange', () => {
	if (!document.hidden) { _updCheck(); }
});
	async function unlockThenStart() {
		// "nothing here" is only for a visitor without the key. A download that broke on the
		// way (a slow or dropped connection, a phone short of memory) says so and offers a
		// retry - it used to show the same two words and leave no way forward.
		const say = (msg, retry) => {
			document.body.innerHTML = '<div style="color:#888;font:16px system-ui;' +
				'text-align:center;margin:40vh 24px 0">' + msg + '</div>';
			if (retry) { document.body.onclick = () => location.reload(); }
		};
		const bad = () => say('nothing here', false);
		let k = (location.hash.match(/k=([A-Za-z0-9_-]+)/) || [])[1];
		if (k) { try { localStorage.setItem('lo_k', k); } catch (e) {} }
		else { try { k = localStorage.getItem('lo_k'); } catch (e) {} }
		if (!k) { return bad(); }
		let key;
		try {
			const pad = '='.repeat((4 - (k.length % 4)) % 4);
			const raw = Uint8Array.from(atob(
				k.replace(/-/g, '+').replace(/_/g, '/') + pad),
				(c) => c.charCodeAt(0));
			key = await crypto.subtle.importKey('raw', raw,
				'AES-GCM', false, ['decrypt']);
		} catch (e) { return bad(); }
		let plain = null;
		let why = '';
		for (let attempt = 0; attempt < 3 && !plain; attempt++) {
			let whole = false;
			try {
				const r = await fetch('index.pck.enc?v=' + BUILD_V +
					(attempt ? '&r=' + attempt : ''),
					attempt ? { cache: 'reload' } : {});
				if (!r.ok) { throw new Error('http ' + r.status); }
				const want = Number(r.headers.get('content-length') || 0);
				const buf = new Uint8Array(await r.arrayBuffer());
				whole = !want || buf.length >= want;
				if (!whole) { throw new Error('cut short'); }
				// subarray, not slice: no second 60 MB copy on a phone
				plain = await crypto.subtle.decrypt(
					{ 'name': 'AES-GCM', 'iv': buf.subarray(0, 12) }, key,
					buf.subarray(12));
			} catch (e) {
				if (whole && e && e.name === 'OperationError') { return bad(); }
				why = (e && (e.message || e.name)) || 'unknown';
			}
		}
		if (!plain) {
			return say('The game did not finish downloading (' + why +
				').<br><br>Tap to try again.', true);
		}
		engine.startGame({
			'mainPack': URL.createObjectURL(new Blob([plain])),
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
