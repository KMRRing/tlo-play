		}

		statusNote.textContent = '';
		statusProgress.removeAttribute('value');
		const rest = new Array(parts.length - 1);
		await inParallel(parts.slice(1), 4, async (part, i) => {
			try { rest[i] = await openBundle(part); } catch (e) {   // a spoiled copy: fetch it once more
				await pack.delete(part.url);
				await fetchBundle(part);
				rest[i] = await openBundle(part);
			}
		});

		if (!SAVED && shell) {
			try {
				await prune([BUILD]);
				if (!saved || saved.v !== BUILD.v) { await keepPage(shell); }
				if (navigator.storage && navigator.storage.persist) { navigator.storage.persist(); }
			} catch (e) {}
		}
		return [index.subarray(0, BUILD.head), ...rest, index.subarray(BUILD.head)];
	}

	// The build that is whole on this device (its BUILD line), or null.
	async function savedBuild(shell) {
		try { return await (await shell.match('saved.json')).json(); } catch (e) { return null; }
	}

	// This build is whole on the device: put its page by for sw.js to serve without a connection.
	async function keepPage(shell) {
		const r = await fetch(location.pathname, { 'cache': 'no-store' });
		const mine = '"v":' + JSON.stringify(BUILD.v);
		if (!r.ok || (await r.clone().text()).indexOf(mine) < 0) { return; }
		await shell.put('index.html', r);
		await shell.put('saved.json', new Response(JSON.stringify(BUILD)));
		for (const picture of ['index.png', 'index.icon.png', 'index.apple-touch-icon.png']) {
			if (!(await shell.match(picture))) { await shell.add(picture).catch(() => {}); }
		}
	}

	async function unlockThenStart() {
		// "nothing here" is only for a visitor without the key. A download that broke on the
		// way (a slow or dropped connection, a phone short of memory) says so and offers a
		// retry.
		const say = (msg, retry) => {
			document.body.innerHTML = '<div style="color:#888;font:16px system-ui;' +
				'text-align:center;margin:40vh 24px 0">' + msg + '</div>';
			if (retry) {
				document.body.onclick = () => location.replace(location.pathname + location.hash);
			}
		};
		const bad = () => say('nothing here', false);
		// A home-screen copy keeps its own storage, so the key a browser tab saved is not
		// there: it asks for the play link once and remembers it.
		const ask = () => {
			say('Paste your play link to finish installing.<br><br>' +
				'<input id="lo-k" style="width:80%;font:16px system-ui;padding:8px" ' +
				'placeholder="https://...#k=...">', false);
			document.getElementById('lo-k').addEventListener('change', (ev) => {
				const m = ev.target.value.match(/(?:k=)?([A-Za-z0-9_-]{20,})\s*$/);
				if (m) { try { localStorage.setItem('lo_k', m[1]); } catch (e) {} }
				location.reload();
			});
		};
		const installed = window.navigator.standalone === true ||
			window.matchMedia('(display-mode: standalone)').matches;
		let k = (location.hash.match(/k=([A-Za-z0-9_-]+)/) || [])[1];
		if (k) { try { localStorage.setItem('lo_k', k); } catch (e) {} }
		else { try { k = localStorage.getItem('lo_k'); } catch (e) {} }
		if (!k) { return installed ? ask() : bad(); }
		if (typeof DecompressionStream === 'undefined') {
			return say('This browser is too old for the game (an iPhone needs iOS 16.4 or later).', false);
		}
		let key;
		try {
			const pad = '='.repeat((4 - (k.length % 4)) % 4);
			const raw = Uint8Array.from(atob(
				k.replace(/-/g, '+').replace(/_/g, '/') + pad),
				(c) => c.charCodeAt(0));
			key = await crypto.subtle.importKey('raw', raw,
				'AES-GCM', false, ['decrypt']);
		} catch (e) { return bad(); }

		let pieces;
		try { pieces = await gatherPack(key); } catch (e) {
			if (e && e.wrongKey) { return bad(); }
			let once = false;
			try {
				once = !sessionStorage.getItem('lo_gone');
				sessionStorage.setItem('lo_gone', '1');
			} catch (x) {}
			// A bundle the site no longer has: a newer build replaced this one mid-download.
			if (e && e.gone && once) { return location.reload(); }
			const saved = SAVED ? null : await savedBuild(await openShell());
			if (saved && saved.v !== BUILD.v) {   // the update can wait: play what is here
				return location.replace(location.pathname + '?saved=1' + location.hash);
			}
			return say('The game did not finish downloading (' +
				((e && (e.message || e.name)) || 'unknown') +
				'). What arrived is kept.<br><br>Tap to carry on.', true);
		}
		try { sessionStorage.removeItem('lo_gone'); } catch (e) {}
		// The engine asks sw.js for its files; on a first visit give the worker a moment to take over.
		if ('serviceWorker' in navigator && !navigator.serviceWorker.controller) {
			await Promise.race([sleep(3000), new Promise((r) => {
				navigator.serviceWorker.addEventListener('controllerchange', r, { 'once': true });
			})]);
		}
		engine.startGame({
			'mainPack': URL.createObjectURL(new Blob(pieces)),
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		unlockThenStart();
	}
}());
		</script>
	</body>
</html>
